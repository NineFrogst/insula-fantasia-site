        background-position: top;

    footer {
        color: var(--bg);
        background-color: var(--fg);
        width: fit-content;
        margin: auto;
        padding: 1px 5px 1px;
        border: 2px solid var(--bg);
        border-radius: 8px;
        font-size: smaller;
        font-weight: bold;
        font-family: 'Consolas', '微软雅黑', monospace;
        text-align: center;
    }
    footer > u.switcher {
        cursor: pointer;
        display: inline;
    }
    div.container {
        background-color: var(--bga);
        background-blend-mode: multiply;
        border: 1px solid black;
        padding: 0px 10px 20px;
        margin-bottom: 20px;
        color: var(--fg);
        font-family: 'Bookman Old Style', '方正标雅宋_GBK', serif;
        font-size: 16px;
    }

    div.pc {
        padding-left: 2em;
        margin-bottom: 5px;
        white-space: pre-line;
        font-style: normal;
    }
    div.pc.action {
        font-style: italic;
    }
    div.pc::before {
        --bgcolor: transparent;
        margin-left: -2em;
        padding-left: 20px;
        border-left: 5px solid var(--bgcolor);
        content: "旁白: ";
        display: block;
        font-weight: bold;
        font-style: normal;
        background-image: var(--dm-dice);
        background-position: left center;
        background-size: 16px;
        background-repeat: no-repeat;
        background-color: var(--bgcolor);
        width: fit-content;
    }
    div.pc.dice::before {
        content: "掷骰: ";
        color: white;
        background-color: darkgray;
        background-image: var(--dm-dice);
    }
    div.pc.dm::before {
        content: "DM（" var(--dm) "）: ";
        color: var(--fgdm);
        background-image: var(--dm-dice);
    }
    div.pc.npc::before {
        content: attr(name)": ";
        color: white;
        background-color: darkgray;
        background-image: var(--dm-dice);
    }
    div.pc.blank::before {
        content: attr(name)": ";
        background-image: var(--dm-dice);
    }
    div.pc.chara1::before {
        content: var(--chara1-pl) "（" var(--chara1) "）: ";
        color: var(--chara1-color);
        background-color: var(--chara1-bg);
        background-image: var(--chara1-ico);
    }
    div.pc.chara2::before {
        content: var(--chara2-pl) "（" var(--chara2) "）: ";
        color: var(--chara2-color);
        background-color: var(--chara2-bg);

    }

    q {
        margin: auto;
        margin-bottom: 20px;
        padding: 5px;
        text-align: left;
        color: var(--bg);
        display: block;
        width: 80%;
        background-color: var(--fg);
        box-shadow: 0px 0px 20px var(--fg);
        border-radius: 5px;
        white-space: pre-line;
    }

    div.profile {
        margin: auto;
        margin-bottom: 20px;
        padding: 5px;
        text-align: left;
        color: var(--bg);
        display: block;
        width: 80%;
        background-color: var(--fg);
        box-shadow: 0px 0px 20px var(--fg);
        border-radius: 5px;
    }

    div.profile > div.avatar {
        float: left;
        width: 140px;
        margin: 5px;
        margin-bottom: 0;
        padding: 5px;
        text-align: center;
    }
    div.profile::after {
        content: "";
        display: block;
        height: 0;
        clear: both;
    }
    div.avatar > img {
        margin: auto;
        width: var(--avatar-size);
        border: 3px solid var(--fg);
    }
    div.profile > div.avatar > img {
        width: 120px;
        border: 3px solid var(--bg);
        background-color: white;
    }
    div.avatar > p {
        margin: 5px;
        margin-bottom: 0;
        font-weight: bold;
    }
    div.avatar > p > span.pl {
        display: block;
        font-size: smaller;
    }
    div.profile > div.description > span {
        white-space: pre-line;
    }

    hr {
        border: 1px solid var(--fg);
        box-shadow: 0px 0px 5px var(--fg);
    }
    hr.battle {
        text-align: center;
        display: block;
        line-height: 0px;
        height: 0;
        overflow: visible;
    }
    hr.battle::after {
        content: "　战斗开始 ！";
        font-size: 20px;
        font-weight: bold;
        color: white;
        text-shadow: 0px 0px 10px var(--fg);
    }
    hr.battle.over::after {
        content: "　战斗结束 ！";
    }
    hr#hr-cursor {
        text-align: center;
        display: block;
        line-height: 0px;
        height: 0;

    div.initiative {
        margin: auto;
        margin-top: 20px;
        margin-bottom: 20px;
        padding: 5px;
        text-align: left;
        color: var(--bg);
        display: grid;
        place-items: center;
        width: fit-content;
        min-width: 40%;
        background-color: var(--fg);
        box-shadow: 0px 0px 20px var(--fg);
        border-radius: 5px;
    }
    div.initiative::before {
        display: block;
        width: 100%;
        content: "先攻表";
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        padding-bottom: 5px;
        border-bottom: 2px solid var(--bg);
        margin-bottom: 5px;
    }
    div.initiative > div.pc {
        min-width: 300px;
    }
    div.initiative > div.pc::before {
        display: inline-block;
        width: fit-content;
        min-width: 110px;
        margin-left: 0px;
        /* text-shadow: 0px 0px 3px var(--bg); */
    }div.initiative > div.pc.chara1::before {
        content: var(--chara1) "：";

    }
    div.initiative > div.pc.chara2::before {

        display: inline-block;
        font-weight: bold;
        margin-right: 0.5em;
    }
    span.dice::before {
        content: attr(name);
        font-size: smaller;
        display: inline-block;
        overflow: visible;
        color: var(--fgd);
    }
    div.initiative span.dice::before {
        color: var(--bgd);
    }
    span.bonus, span.result {
        display: inline-block;
        margin-right: 0.5em;
    }
    span.bonus.up::before {
        content: '+ ';
    }
    span.bonus.down::before {
        content: '- ';
    }
    span.result::before {
        content: '= ';
    }
    span.ranking {
        font-weight: bold;
    }

        margin-bottom: 7px;

        background-color: var(--fga);
        color: var(--bg);
        border-radius: 5px;
    }
    div.with-avatar > div.pc {

        padding-top: 16px;
        padding-left: 25px;
    }
    div.with-avatar > div.pc::before {
        border-radius: 5px;
        padding-right: 5px;
        margin-bottom: 5px;
        margin-left: -25px;
    }
    div.with-avatar::before {
        display: block;
        float: left;
        background-color: white;
        background-size: var(--avatar-size);
        background-repeat: no-repeat;
        content: "";
        width: var(--avatar-size);
        height: var(--avatar-size);
        border: 3px solid var(--fg);

    }

    <script id="i-asked-ai-i-m-sorry">
        function load_page(file = 'new_report.html', box_id = 'host'){
            async function loader() {
                // ① 抓取
                var html = await fetch(file).then(r => r.text());
                // ② 解析
                var frag = new DOMParser().parseFromString(html, 'text/html');
                var comp = frag.querySelectorAll('div.container');   // 目标组件
                var host = document.getElementById(box_id);
                host.replaceChildren();
                var editor_box = frag.querySelectorAll('#editor-box');
                if (editor_box.length){
                    document.getElementById('editor-box').innerText = editor_box[0].innerText;
                } else {
                    document.getElementById('editor-box').innerText = 'pincherryus';
                }
                for (var i = 0; i < comp.length; i++){
                    host.appendChild(comp[i]);
                }
            }
            return loader;
        }
        (async () => {
            await load_page('reports/contents.html', 'contents')();   // 等 DOM 就位

            // 现在 #contents 里已经有 <li> 了
            document.querySelectorAll('div#contents li').forEach(item => {
                item.addEventListener('click', load_page(item.getAttribute('name')));
                // item.click(); // 初始化
            });
        })();
    </script>

            aud.load();
            aud.play();
        }
    </script>
